name: Validate and link memory GIFs
on:
  push:
    branches: [main]
    paths:
      - 'assets/sanrio/**/*.gif'
      - 'assets/silksong/**/*.gif'
      - 'assets/colossus/**/*.gif'
      - 'assets/lies-of-p/**/*.gif'
      - 'assets/terraria/**/*.gif'
      - 'assets/dark-souls/**/*.gif'
      - 'assets/bloodborne/**/*.gif'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link-verified-gifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIF decoder
        run: python -m pip install Pillow
      - name: Check exact GIF sizes and populate mappings
        run: python scripts/install-memory-gifs.py
      - name: Save mapping updates without editing Hollow Knight
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory-matching-data.js chapters/memory-game.html
          if ! git diff --cached --quiet; then
            git commit -m "Link verified animated memory GIFs to their exact names"
            git push
          fi
