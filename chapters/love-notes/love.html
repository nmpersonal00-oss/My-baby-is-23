<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6e3f83">
  <meta name="description" content="Thirty little memories, one glowing string, and our love story in Rayan's Dark Forest.">
  <title>Love · Secret Love Notes · Rayan's Dark Forest</title>
  <link rel="icon" href="../../assets/heart.svg" type="image/svg+xml">
  <link rel="preload" href="../../assets/love-memory-sky.webp" as="image" type="image/webp">
  <link rel="preload" href="../../assets/love-polaroid-thumbnails-clean.webp?v=1" as="image" type="image/webp">
  <link rel="stylesheet" href="../../love-memory.css">
  <script defer src="../../love-memory.js"></script>
  <link rel="stylesheet" href="../../forest-music.css?v=4">
  <script defer src="../../forest-audio-config.js?v=2"></script>
  <script async src="https://accounts.google.com/gsi/client"></script>
  <script defer src="../../forest-drive.js?v=1"></script>
  <script defer src="../../forest-music.js?v=5"></script>
</head>
<body class="love-memory-page">
  <main class="love-memory-scene" id="love-memory-scene" aria-label="Our thirty memories — an animated love scrapbook">
    <div class="memory-painting" aria-hidden="true"></div>
    <h1 class="screen-reader-only">Love — Our Little Polaroid Memories</h1>
    <a class="memory-back" href="../love-notes.html" aria-label="Back to the flying love letters">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 6 8 16l10 10M9 16h17" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="memory-mobile-heading" aria-hidden="true">Love</div>
    <div class="memory-ambient" id="memory-ambient" aria-hidden="true"></div>

    <div class="memory-thread-stage" id="memory-thread-stage">
      <svg class="memory-thread" id="memory-thread" viewBox="0 0 1672 941" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="memory-thread-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
          <linearGradient id="memory-thread-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff9d7"/><stop offset=".36" stop-color="#ffb8b4"/><stop offset=".7" stop-color="#ffe9aa"/><stop offset="1" stop-color="#fff2d7"/></linearGradient>
        </defs>
        <path class="memory-thread-aura" id="memory-thread-aura"></path>
        <path class="memory-thread-core" id="memory-thread-core"></path>
      </svg>
      <div class="memory-polaroids" id="memory-polaroids" role="group" aria-label="30 moments of us, revealed one by one"></div>
      <div class="memory-sparkle-bursts" id="memory-sparkle-bursts" aria-hidden="true"></div>
    </div>

    <div class="memory-finale-mist" id="memory-finale-mist" aria-hidden="true"></div>
    <div class="memory-couple-finale" id="memory-couple-finale" aria-hidden="true">
      <img src="../../assets/love-memory-couple.webp" width="715" height="395" alt="" draggable="false">
      <span class="memory-finale-halo"></span>
    </div>
    <div class="memory-mobile-ending" aria-hidden="true"><img src="../../assets/love-memory-couple.webp" width="715" height="395" alt=""></div>
    <p class="screen-reader-only" id="memory-announcement" role="status" aria-live="polite"></p>
  </main>

  <div class="memory-lightbox" id="memory-lightbox" role="dialog" aria-modal="true" aria-label="Polaroid memory" hidden>
    <button type="button" class="memory-lightbox-close" id="memory-lightbox-close" aria-label="Close this memory">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 16 16M22 6 6 22" stroke-linecap="round"/></svg>
    </button>
    <div class="memory-lightbox-polaroid" id="memory-lightbox-polaroid">
      <div class="memory-lightbox-picture" id="memory-lightbox-picture"></div>
      <div class="memory-lightbox-label" id="memory-lightbox-label"></div>
    </div>
  </div>
</body>
</html>
