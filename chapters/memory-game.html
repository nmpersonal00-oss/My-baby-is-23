<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080418">
  <meta name="description" content="Rayan's Dark Forest — magical GIF-to-name Memory Matching in eight enchanted worlds.">
  <title>Memory Matching · Rayan's Dark Forest</title>
  <link rel="icon" href="../assets/heart.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="preload" href="../assets/memory-gothic-citadel.avif" as="image" type="image/avif">
  <link rel="stylesheet" href="../memory-matching.css?v=11">
  <script defer src="../memory-matching-data.js?v=1"></script>
  <script defer src="../memory-matching.js?v=11"></script>
</head>
<body>
  <!-- ONLY the scene is an image. Titles, categories, rounds, GIFs and names are live elements. -->
  <div class="memory-scenery" aria-hidden="true"></div>
  <div class="memory-sparkles" id="memory-sparkles" aria-hidden="true"></div>
  <div class="memory-layout">
    <aside class="memory-rail" aria-label="Forest navigation">
      <a class="memory-crest" href="../index.html" aria-label="Rayan's Dark Forest home">
        <span class="memory-crest-crown" aria-hidden="true">♛</span>
        <span class="memory-crest-letter" aria-hidden="true">R</span>
        <span class="memory-crest-leaves" aria-hidden="true">❧ ✦ ❧</span>
      </a>
      <nav class="memory-rail-nav" aria-label="Other pages">
        <a class="memory-home-button" href="../index.html"><span aria-hidden="true">⌂</span> HOME</a>
      </nav>
      <button id="memory-sound" class="memory-sound" type="button" aria-pressed="true" aria-label="Turn magical sounds off">
        <span aria-hidden="true">♫</span><span id="memory-sound-label">Sound on</span>
      </button>
    </aside>

    <main class="memory-main">
      <header class="memory-heading">
        <a href="../index.html" class="memory-heading-link"><h1>Rayan's Dark Forest</h1></a>
        <div class="memory-title-row"><span aria-hidden="true">✦</span><h2>Memory Matching</h2><span aria-hidden="true">✦</span></div>
        <p>Match each GIF to its correct name.</p>
      </header>

      <div class="memory-content">
        <section class="memory-categories" aria-labelledby="memory-category-heading">
          <div class="memory-categories-crown" aria-hidden="true">♛</div>
          <h2 id="memory-category-heading">CHOOSE A CATEGORY</h2>
          <div class="memory-categories-decoration" aria-hidden="true">❧ ── ✦ ── ❧</div>
          <nav id="memory-worlds" class="memory-world-list" aria-label="Choose a category"></nav>
          <div class="memory-categories-bottom" aria-hidden="true">❧ ✦ ❧</div>
        </section>

        <section class="memory-game" aria-labelledby="memory-world-title">
          <header class="memory-game-top">
            <div class="memory-selected-world">
              <span class="memory-world-emblem" id="memory-world-emblem" aria-hidden="true">♘</span>
              <h2 id="memory-world-title">Hollow Knight</h2>
            </div>
            <div class="memory-round-label" id="memory-round-label">Round 1 of 5</div>
            <nav id="memory-rounds" class="memory-rounds" aria-label="Choose a round"></nav>
          </header>

          <div class="memory-matching-board" id="memory-board">
            <ol class="memory-match-list memory-gifs" id="memory-gif-list" aria-label="GIF clues"></ol>
            <div class="memory-center-lane" aria-hidden="true">
              <svg id="memory-connections" class="memory-connections" aria-hidden="true"></svg>
            </div>
            <ol class="memory-match-list memory-names" id="memory-name-list" aria-label="Name choices"></ol>
          </div>

          <div class="memory-footer-badge">
            <span class="memory-footer-crown" aria-hidden="true">♛</span>
            <div class="memory-footer-badge-label"><span aria-hidden="true">✦</span> <span>10 Matches per Round</span> <span aria-hidden="true">✦</span></div>
          </div>
          <div class="memory-small-actions">
            <button id="memory-shuffle" class="memory-small-button" type="button">⤨ Shuffle</button>
            <span id="memory-progress" class="memory-progress" role="status" aria-live="polite">0 / 10 matched</span>
          </div>
          <p id="memory-feedback" class="memory-feedback" role="status" aria-live="polite">All GIF and name spaces are ready to fill.</p>
        </section>
      </div>
    </main>
  </div>
  <div id="memory-dialog-root"></div>
</body>
</html>
