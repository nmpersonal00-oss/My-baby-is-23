<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>Memory Matching · Rayan's Dark Forest</title>
<link rel="stylesheet" href="../memory-matching.css?v=5">
<script defer src="../memory-matching.js?v=5"></script>
</head>
<body>
<main id="memory-holder" aria-label="Rayan's Dark Forest Memory Matching">
  <div id="memory-stage">
    <a class="hotspot home" href="../index.html" aria-label="Home"></a>
    <button class="hotspot trivia" type="button" aria-label="Trivia Quiz (coming later)" disabled></button>
    <button class="hotspot hangman" type="button" aria-label="Hangman (coming later)" disabled></button>
    <nav id="categories" aria-label="Choose a category"></nav>
    <nav id="rounds" aria-label="Choose a round"></nav>
    <div id="category-display" aria-live="polite"></div>
    <div id="round-display" aria-live="polite"></div>
    <div id="image-slots" aria-label="Ten empty image spaces"></div>
    <div id="name-slots" aria-label="Ten empty name spaces"></div>

  </div>
